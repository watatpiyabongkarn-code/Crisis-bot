name: weekly-paper-bot
on:
  schedule:
    - cron: '0 1 * * 6'   # every Saturday 01:00 UTC = 08:00 Bangkok
  workflow_dispatch: {}    # manual "Run workflow" button

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - name: run paper bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python paper_bot.py --test
      - name: commit ledger
        run: |
          git config user.name "crisis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ledger.json docs/data.json
          git diff --cached --quiet || git commit -m "weekly run $(date -u +%F)"
          git push
